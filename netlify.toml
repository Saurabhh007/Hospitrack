[build]
  publish = "."

# Static asset 404 guards: Missing assets must NEVER silently rewrite to index.html with 200
[[redirects]]
  from = "/css/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/js/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA route fallback for client-side navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

